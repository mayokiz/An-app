name: Build Actual Kyant0 Android App

on:
  workflow_dispatch:
  push:
    branches:
      - kyant0-library

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Clone actual Kyant0 repository
        run: |
          git clone --depth 1 --branch kmp \
            https://github.com/Kyant0/AndroidLiquidGlass.git upstream

      - name: Verify actual Android app module
        run: |
          test -f upstream/androidApp/build.gradle.kts
          grep -q 'com.kyant.backdrop.catalog' \
            upstream/androidApp/build.gradle.kts

      - name: Build actual Kyant0 APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Verify APK package
        run: |
          APK=$(find upstream/androidApp/build/outputs/apk/debug \
            -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" \
            | grep "package: name='com.kyant.backdrop.catalog'"

      - name: Upload actual Kyant0 APK
        uses: actions/upload-artifact@v4
        with:
          name: ACTUAL-KYANT0-ANDROID-APP
          path: upstream/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
