name: Build Kyant0 Backdrop Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kyant0-library

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Download the actual Kyant0 AndroidLiquidGlass repository
        run: |
          git clone --depth 1 --branch kmp https://github.com/Kyant0/AndroidLiquidGlass.git upstream

      - name: Build the upstream Android demo
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kyant0-Backdrop-Android-Demo
          path: upstream/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
